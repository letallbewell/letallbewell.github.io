<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathew Alex | Files</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/dreampulse/computer-modern-web-font@master/fonts.css">
    <link rel="icon" href="favicon.ico">


    <style>
    body { font-family: sans-serif; padding: 2rem; }
    ul { list-style: none; padding-left: 1rem; }
    .folder { font-weight: bold; margin-top: 10px; }
    .file a { text-decoration: none; color: blue; }
    </style>

</head>

<body>

<h1>File Browser</h1>
<hr style="width:100%;">

  <div id="output">Loading...</div>


  <script>
    const username = "letallbewell";    // replace with your GitHub username
    const repo = "letallbewell.github.io";            // replace with your GitHub repo
    const branch = "gh-pages";               // replace with branch, e.g. 'main' or 'gh-pages'
    const rootPath = "files";            // folder you want to list

    const pagesBase = `https://${username}.github.io/`;

    async function fetchFiles(path, container) {
      const apiUrl = `https://api.github.com/repos/${username}/${repo}/contents/${path}?ref=${branch}`;
      const res = await fetch(apiUrl);
      if (!res.ok) {
        container.textContent = "Error fetching files.";
        return;
      }

      const data = await res.json();
      const ul = document.createElement("ul");

      for (const item of data) {
        const li = document.createElement("li");

        if (item.type === "dir") {
          li.textContent = item.name;
          li.classList.add("folder");
          ul.appendChild(li);
          await fetchFiles(item.path, li);
        } else if (item.type === "file") {
          const a = document.createElement("a");
          a.href = pagesBase + item.path;
          a.textContent = item.name;
          a.target = "_blank";
          li.classList.add("file");
          li.appendChild(a);
          ul.appendChild(li);
        }
      }

      container.appendChild(ul);
    }

    const output = document.getElementById("output");
    output.textContent = "";
    fetchFiles(rootPath, output);
  </script>

  

</body>
</html>
